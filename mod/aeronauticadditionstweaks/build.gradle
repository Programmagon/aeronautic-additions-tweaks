
plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.0.0'
group = 'com.poisiniously'

base {
    archivesName = 'aeronauticadditionstweaks'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = '21.1.228'

    mods {
        aeronauticadditionstweaks {
            sourceSet sourceSets.main
        }
    }
}
